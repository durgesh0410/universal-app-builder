name: Publish to Play
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Build and Upload
        run: |
          ls -R
          echo "--- jks dhoond rahe ---"
          find . -name "*.jks" -o -name "*.keystore"
          echo "--- arrowpuzzle andar ---"
          ls -la arrowpuzzle/
          ls -la arrowpuzzle/android/app/ || ls -la arrowpuzzle/android/
          # chabi ko sahi jagah rakho
          JKS_SRC=$(find . -name "release-key.jks" | head -1)
          echo "JKS mila: $JKS_SRC"
          mkdir -p arrowpuzzle/android/app
          cp "$JKS_SRC" arrowpuzzle/android/app/release-key.jks
          cd arrowpuzzle
          ALIAS=$(keytool -list -keystore android/app/release-key.jks -storepass 123456 | grep PrivateKeyEntry | cut -d, -f1)
          echo "ALIAS: $ALIAS"
          echo "storePassword=123456
          keyPassword=123456
          keyAlias=$ALIAS
          storeFile=release-key.jks" > android/key.properties
          sed -i 's/compileSdk 34/compileSdk 35/' android/app/build.gradle || true
          sed -i 's/compileSdk = 34/compileSdk = 35/' android/app/build.gradle || true
          sed -i 's/compileSdk 34/compileSdk 35/' android/app/build.gradle.kts || true
          flutter build appbundle --release
      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_JSON }}
          packageName: com.arrowpuzzle.durgesh0410
          releaseFiles: arrowpuzzle/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
