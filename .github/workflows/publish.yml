name: Publish to Play
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build AAB
        run: |
          JKS_SRC=$(find . -name "release-key.jks" | head -1)
          mkdir -p arrowpuzzle/android/app
          cp "$JKS_SRC" arrowpuzzle/android/app/release-key.jks
          cd arrowpuzzle
          ALIAS=$(keytool -list -keystore android/app/release-key.jks -storepass 123456 | grep PrivateKeyEntry | cut -d, -f1)
          printf "storePassword=123456\nkeyPassword=123456\nkeyAlias=$ALIAS\nstoreFile=release-key.jks\n" > android/key.properties
          sed -i 's/compileSdk 34/compileSdk 35/' android/app/build.gradle || true
          flutter build appbundle --release
          cd ..
          echo "${{ secrets.PLAY_JSON }}" > play.json
      - name: Upload All to Play Console
        run: |
          gem install fastlane -N
          fastlane android deploy
