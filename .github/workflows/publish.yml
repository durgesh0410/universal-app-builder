name: Publish to Play + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
          
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          
      - name: Build AAB and Fix minSdk
        run: |
          cd arrowpuzzle
          flutter create --platforms=android --org com.arrowpuzzle.durgesh0410 --project-name arrowpuzzle . --overwrite
          
          # Force update minSdkVersion to 24 in all build.gradle files
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read file; do
            sed -i 's/minSdk 21/minSdk 24/g' "$file"
            sed -i 's/minSdkVersion 21/minSdkVersion 24/g' "$file"
            sed -i 's/minSdk = 21/minSdk = 24/g' "$file"
            sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' "$file"
          end
          
          echo "flutter.minSdkVersion=24" >> android/local.properties
          
          # Decode JKS and Build
          echo "$RELEASE_JKS_BASE64" | base64 --decode > android/app/release-key.jks
          flutter build appbundle --release
        env:
          RELEASE_JKS_BASE64: ${{ secrets.RELEASE_JKS_BASE64 }}

      - name: Deploy to Play Store (Internal Track)
        run: |
          if [ -z "${{ secrets.PLAY_KEY_JSON }}" ]; then
            echo "PLAY_KEY_JSON secret is missing!"
            exit 1
          fi
          echo '${{ secrets.PLAY_KEY_JSON }}' > /tmp/play.json
          gem install fastlane -N
          cd arrowpuzzle
          fastlane supply \
            --json_key /tmp/play.json \
            --package_name com.arrowpuzzle.durgesh0410 \
            --track internal \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --skip_upload_apk true \
            --skip_upload_metadata false \
            --skip_upload_images true \
            --skip_upload_screenshots false
