name: Publish to Play + Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure android exists + fix package
        run: |
          if [ ! -d "android/app" ]; then
            flutter create . --org com.arrowpuzzle.durgesh0410 --project-name arrowpuzzle
          fi
          GRADLE_FILE=$(find . -name "build.gradle.kts" | grep "android/app" | head -1)
          echo "GRADLE: $GRADLE_FILE"
          sed -i 's/minSdk = 21/minSdk = 24/' "$GRADLE_FILE" || true
          sed -i 's/minSdkVersion 21/minSdkVersion 24/' "$GRADLE_FILE" || true
          sed -i 's/applicationId = ".*"/applicationId = "com.arrowpuzzle.durgesh0410.v1"/' "$GRADLE_FILE" || true
          sed -i 's/namespace = ".*"/namespace = "com.arrowpuzzle.durgesh0410.v1"/' "$GRADLE_FILE" || true
          grep -E "minSdk|applicationId|namespace" "$GRADLE_FILE"

      - name: Signing
        run: |
          APP_DIR="."
          echo "${{ secrets.RELEASE_JKS_BASE64 }}" | base64 --decode > $APP_DIR/android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > $APP_DIR/android/key.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $APP_DIR/android/key.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> $APP_DIR/android/key.properties
          echo "storeFile=upload-keystore.jks" >> $APP_DIR/android/key.properties
          cat $APP_DIR/android/key.properties

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload to Play
        run: |
          sudo gem install fastlane -N
          echo '${{ secrets.PLAY_KEY_JSON }}' > /tmp/play.json
          fastlane supply --json_key /tmp/play.json --package_name com.arrowpuzzle.durgesh0410.v1 --track internal --aab build/app/outputs/bundle/release/app-release.aab --skip_upload_apk true --skip_upload_metadata false --skip_upload_images true --skip_upload_screenshots false
