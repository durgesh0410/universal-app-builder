name: Publish to Play
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Create Android + Build
        run: |
          cd arrowpuzzle
          ls -la
          cat pubspec.yaml
          # android folder banao - yahi missing tha!
          flutter create --platforms=android --org com.arrowpuzzle.durgesh0410 --project-name arrowpuzzle . --overwrite
          ls -la android/app/
          # SDK 35 fix
          sed -i 's/compileSdk 34/compileSdk 35/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdk = 34/compileSdk = 35/g' android/app/build.gradle.kts || true
          # chabi lagao
          JKS_SRC=$(find .. -name "release-key.jks" | head -1)
          echo "JKS: $JKS_SRC"
          cp "$JKS_SRC" android/app/release-key.jks
          ALIAS=$(keytool -list -keystore android/app/release-key.jks -storepass 123456 | grep PrivateKeyEntry | cut -d, -f1)
          echo "ALIAS: $ALIAS"
          printf "storePassword=123456\nkeyPassword=123456\nkeyAlias=$ALIAS\nstoreFile=release-key.jks\n" > android/key.properties
          cat android/key.properties
          flutter pub get
          flutter build appbundle --release
      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_JSON }}
          packageName: com.arrowpuzzle.durgesh0410
          releaseFiles: arrowpuzzle/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
