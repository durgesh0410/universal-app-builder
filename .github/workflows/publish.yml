name: Publish to Play + Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find real project
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== FIND GRADLE ==="
          find . -maxdepth 4 -name "build.gradle*" 2>/dev/null
          echo "=== FIND PUBSPEC ==="
          find . -maxdepth 3 -name "pubspec.yaml" 2>/dev/null

      - name: Fix minSdk auto-detect
        run: |
          GRADLE_FILE=$(find . -name "build.gradle.kts" | head -1)
          echo "Found: $GRADLE_FILE"
          if [ -n "$GRADLE_FILE" ]; then
            sed -i 's/minSdk = 21/minSdk = 24/' "$GRADLE_FILE" || true
            sed -i 's/minSdkVersion 21/minSdkVersion 24/' "$GRADLE_FILE" || true
            grep -i minSdk "$GRADLE_FILE"
          else
            echo "NO GRADLE FILE - CHECK STRUCTURE ABOVE"
            exit 1
          fi

      - name: Signing with your secrets
        run: |
          # auto detect android folder
          if [ -d "arrowpuzzle/android/app" ]; then
            APP_DIR="arrowpuzzle"
          elif [ -d "android/app" ]; then
            APP_DIR="."
          else
            APP_DIR=$(dirname $(find . -name "build.gradle.kts" | head -1) | sed 's|/app$||' | sed 's|/android$||')
            echo "Detected APP_DIR=$APP_DIR"
          fi
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          echo "Using APP_DIR=$APP_DIR"
          ls -la $APP_DIR/android/app/
          echo "${{ secrets.RELEASE_JKS_BASE64 }}" | base64 --decode > $APP_DIR/android/app/upload-keystore.jks
          ls -lh $APP_DIR/android/app/*.jks
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > $APP_DIR/android/key.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $APP_DIR/android/key.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> $APP_DIR/android/key.properties
          echo "storeFile=upload-keystore.jks" >> $APP_DIR/android/key.properties
          cat $APP_DIR/android/key.properties
          keytool -list -v -keystore $APP_DIR/android/app/upload-keystore.jks -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" | head -10

      - name: Build AAB
        run: |
          echo "Building in $APP_DIR"
          cd $APP_DIR
          flutter build appbundle --release

      - name: Upload to Play - com.arrowpuzzle.durgesh0410.v1
        run: |
          ls -lh $APP_DIR/build/app/outputs/bundle/release/app-release.aab
          sudo gem install fastlane -N
          echo '${{ secrets.PLAY_KEY_JSON }}' > /tmp/play.json
          fastlane supply --json_key /tmp/play.json --package_name com.arrowpuzzle.durgesh0410.v1 --track internal --aab $APP_DIR/build/app/outputs/bundle/release/app-release.aab --skip_upload_apk true --skip_upload_metadata false --skip_upload_images true --skip_upload_screenshots false
