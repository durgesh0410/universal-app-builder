name: Publish to Play + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          
      - name: Build AAB
        run: |
          cd arrowpuzzle
          flutter create --platforms=android --org com.arrowpuzzle.durgesh0410 --project-name arrowpuzzle . --overwrite
          
          echo "flutter.minSdkVersion=24" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read file; do
            sed -i 's/flutter.minSdkVersion/24/g' "$file"
            sed -i 's/minSdkVersion 21/minSdkVersion 24/g' "$file"
            sed -i 's/minSdk 21/minSdk 24/g' "$file"
            sed -i 's/minSdkVersion = 21/minSdkVersion = 24/g' "$file"
            sed -i 's/minSdk = 21/minSdk = 24/g' "$file"
          done
          
          JKS_SRC=$(find .. -name "release-key.jks" | head -n 1)
          cp "$JKS_SRC" android/app/release-key.jks
          ALIAS=$(keytool -list -keystore android/app/release-key.jks -storepass 123456 | grep PrivateKeyEntry | cut -d',' -f1)
          
          cat << 'KEYEOF' > android/key.properties
storePassword=123456
keyPassword=123456
keyAlias=$ALIAS
storeFile=release-key.jks
KEYEOF
          sed -i "s/\$ALIAS/$ALIAS/g" android/key.properties
          
          sed -i '/buildTypes {/i \    signingConfigs {\n        release {\n            def keystoreProperties = new Properties()\n            def keystorePropertiesFile = rootProject.file("key.properties")\n            if (keystorePropertiesFile.exists()) {\n                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n            }\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n            storeFile file(keystoreProperties["storeFile"])\n            storePassword keystoreProperties["storePassword"]\n        }\n    }\n' android/app/build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' android/app/build.gradle
          
          flutter build appbundle --release

      - name: Deploy to Play Store
        env:
          PLAY_JSON_CONTENT: ${{ secrets.PLAY_KEY_JSON }}
        run: |
          if [ -z "$PLAY_JSON_CONTENT" ]; then echo "SECRET KHAALI HAI"; exit 1; fi
          echo "$PLAY_JSON_CONTENT" > /tmp/play.json
          gem install fastlane -N
          cd arrowpuzzle
          fastlane supply --json_key /tmp/play.json --package_name com.arrowpuzzle.durgesh0410 --track internal --aab build/app/outputs/bundle/release/app-release.aab --metadata_path fastlane/metadata/android --skip_upload_apk true --skip_upload_metadata false --skip_upload_images true --skip_upload_screenshots false --verbose
