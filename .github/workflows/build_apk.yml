name: Build Colony Fix APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        cache: true

    - name: Install Dependencies
      run: cd colony_fix && flutter pub get

    - name: Build APK
      run: cd colony_fix && flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: colony-fix-apk
        path: colony_fix/build/app/outputs/flutter-apk/app-release.apk

