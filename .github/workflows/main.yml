name: Publish to Play + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          
      - name: Build AAB
        env:
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd arrowpuzzle
          
          # Step 1: Generate fresh Android structure
          flutter create --platforms=android --org com.arrowpuzzle.durgesh0410 --project-name v1 .
          
          # Step 2: Copy keystore
          JKS_SRC=$(find .. -name "release-key.jks" | head -n 1)
          if [ -f "$JKS_SRC" ]; then
            cp "$JKS_SRC" android/app/release-key.jks
            echo "Keystore copied successfully"
          else
            echo "ERROR: release-key.jks not found!"
            exit 1
          fi
          
          # Step 3: Force Kotlin version 1.9.0 globally in android/build.gradle
          if [ -f "android/build.gradle" ]; then
            echo "buildscript { ext.kotlin_version = '1.9.0' }" > android/build.gradle.new
            cat android/build.gradle >> android/build.gradle.new
            mv android/build.gradle.new android/build.gradle
          fi

          # Step 4: Write clean build.gradle.kts with compileSdk = 35 and correct release signing
          rm -f android/app/build.gradle.kts
          cat << 'GRADLE_EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.arrowpuzzle.durgesh0410.v1"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.arrowpuzzle.durgesh0410.v1"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("release-key.jks")
                      storePassword = System.getenv("STORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          GRADLE_EOF
          
          flutter build appbundle --release

      - name: Deploy to Play Store
        env:
          PLAY_JSON_CONTENT: ${{ secrets.PLAY_KEY_JSON }}
        run: |
          if [ -z "$PLAY_JSON_CONTENT" ]; then echo "SECRET KHAALI HAI"; exit 1; fi
          echo "$PLAY_JSON_CONTENT" > /tmp/play.json
          gem install fastlane -N
          cd arrowpuzzle
          fastlane supply --json_key /tmp/play.json --package_name com.arrowpuzzle.durgesh0410.v1 --track internal --aab build/app/outputs/bundle/release/app-release.aab --skip_upload_apk true --skip_upload_metadata false --skip_upload_images true --skip_upload_screenshots false --verbose
