name: Ultimate Play Store Auto Deploy

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 4. Decode Keystore & Create key.properties
        run: |
          mkdir -p arrowpuzzle/android/app
          echo "${{ secrets.RELEASE_JKS_BASE64 }}" | base64 --decode > arrowpuzzle/android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > arrowpuzzle/android/key.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> arrowpuzzle/android/key.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> arrowpuzzle/android/key.properties
          echo "storeFile=upload-keystore.jks" >> arrowpuzzle/android/key.properties

      - name: 5. Build Signed Release AAB
        working-directory: arrowpuzzle
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: 6. Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: 7. Install Fastlane & Create JSON Key
        run: |
          gem install fastlane
          mkdir -p arrowpuzzle/android/fastlane
          echo '${{ secrets.PLAY_KEY_JSON }}' > arrowpuzzle/android/fastlane/play-store-key.json

      - name: 8. Upload AAB, Metadata & Screenshots to Play Console
        working-directory: arrowpuzzle/android
        run: fastlane deploy
