name: Publish to Play + Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          
      - name: Build AAB with Verified Alias arrowpuzzle
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd arrowpuzzle
          
          # Step 1: Generate fresh Android structure
          flutter create --platforms=android --org com.arrowpuzzle.durgesh0410 --project-name v1 .
          
          # Step 2: Copy keystore to android/app/release-key.jks
          JKS_SRC=$(find .. -name "release-key.jks" | head -n 1)
          if [ -f "$JKS_SRC" ]; then
            cp "$JKS_SRC" android/app/release-key.jks
            echo "Keystore copied successfully"
          else
            echo "ERROR: release-key.jks not found!"
            exit 1
          fi

          # Step 3: Disable lint globally
          echo "android.lint.checkReleaseBuilds=false" >> android/gradle.properties
          echo "android.lint.abortOnError=false" >> android/gradle.properties

          # Step 4: Write build.gradle.kts with the exact verified alias 'arrowpuzzle'
          python3 -c '
          import os

          store_pass = os.getenv("STORE_PASSWORD", "").strip() or "123456"
          key_pass = os.getenv("KEY_PASSWORD", "").strip() or store_pass
          alias = "arrowpuzzle"

          print(f"Using Verified Alias: {alias}")

          try:
              with open("android/settings.gradle", "r") as f:
                  content = f.read()
              if "org.jetbrains.kotlin.android" in content:
                  import re
                  content = re.sub(r"id\s*[\x27\x22]org\.jetbrains\.kotlin\.android[\x27\x22]\s*version\s*[\x27\x22][^\x27\x22]*[\x27\x22]", "id \"org.jetbrains.kotlin.android\" version \"1.9.24\"", content)
              with open("android/settings.gradle", "w") as f:
                  f.write(content)
          except Exception as e:
              print("settings.gradle patch note:", e)

          gradle_content = f"""plugins {{
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }}

          android {{
              namespace = "com.arrowpuzzle.durgesh0410.v1"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {{
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }}

              kotlinOptions {{
                  jvmTarget = "1.8"
              }}

              defaultConfig {{
                  applicationId = "com.arrowpuzzle.durgesh0410.v1"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }}

              signingConfigs {{
                  create("release") {{
                      storeFile = file("release-key.jks")
                      storePassword = "{store_pass}"
                      keyAlias = "{alias}"
                      keyPassword = "{key_pass}"
                  }}
              }}

              buildTypes {{
                  getByName("release") {{
                      signingConfig = signingConfigs.getByName("release")
                  }}
              }}
          }}

          flutter {{
              source = "../.."
          }}
          """

          with open("android/app/build.gradle.kts", "w") as f:
              f.write(gradle_content)
          print("Successfully generated build.gradle.kts with exact alias arrowpuzzle.")
          '

          # Step 5: Build Release AAB
          flutter build appbundle --release

      - name: Deploy to Play Store
        env:
          PLAY_JSON_CONTENT: ${{ secrets.PLAY_KEY_JSON }}
        run: |
          if [ -z "$PLAY_JSON_CONTENT" ]; then echo "SECRET KHAALI HAI"; exit 1; fi
          echo "$PLAY_JSON_CONTENT" > /tmp/play.json
          gem install fastlane -N
          cd arrowpuzzle
          fastlane supply --json_key /tmp/play.json --package_name com.arrowpuzzle.durgesh0410.v1 --track internal --aab build/app/outputs/bundle/release/app-release.aab --skip_upload_apk true --skip_upload_metadata false --skip_upload_images true --skip_upload_screenshots false --verbose
