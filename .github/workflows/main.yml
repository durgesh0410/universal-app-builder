name: Publish to Play + Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Create android if missing
        run: |
          if [ ! -d "android/app" ] && [ ! -d "arrowpuzzle/android/app" ]; then
            flutter create . --org com.arrowpuzzle --project-name arrowpuzzle || flutter create . --org com.arrowpuzzle
          fi

      - name: Signing Setup & Lint Disable
        run: |
          if [ -d "arrowpuzzle/android/app" ]; then APP_DIR="arrowpuzzle"; else APP_DIR="."; fi
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          
          # Disable lint globally to prevent webview crashes
          echo "android.lint.checkReleaseBuilds=false" >> $APP_DIR/android/gradle.properties
          echo "android.lint.abortOnError=false" >> $APP_DIR/android/gradle.properties

          # Setup Keystore if secret exists
          if [ -n "${{ secrets.RELEASE_JKS_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_JKS_BASE64 }}" | base64 --decode > $APP_DIR/android/app/release-key.jks
            echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > $APP_DIR/android/key.properties
            echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $APP_DIR/android/key.properties
            echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> $APP_DIR/android/key.properties
            echo "storeFile=release-key.jks" >> $APP_DIR/android/key.properties
          fi

      - name: Build AAB
        run: |
          cd $APP_DIR
          flutter build appbundle --release

      - name: Upload to Play
        env:
          PLAY_JSON_CONTENT: ${{ secrets.PLAY_KEY_JSON }}
        run: |
          if [ -z "$PLAY_JSON_CONTENT" ]; then echo "SECRET KHAALI HAI"; exit 1; fi
          sudo gem install fastlane -N
          echo "$PLAY_JSON_CONTENT" > /tmp/play.json
          cd $APP_DIR
          fastlane supply --json_key /tmp/play.json --package_name com.arrowpuzzle.durgesh0410.v1 --track internal --aab build/app/outputs/bundle/release/app-release.aab --skip_upload_apk true --skip_upload_metadata false --skip_upload_images true --skip_upload_screenshots false
