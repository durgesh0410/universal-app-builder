name: Publish Arrow Puzzle FINAL
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build + Sign + Upload - FULL AUTO
        run: |
          cd arrowpuzzle
          flutter create --org com.arrowpuzzle --project-name arrowpuzzle .
          # CHABI BILKUL SAHI JAGAH - android/app ke andar
          keytool -genkey -v -keystore android/app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias arrowpuzzle -storepass 123456 -keypass 123456 -dname "CN=Durgesh, OU=ArrowPuzzle, O=Durgesh, L=Dindori, ST=MP, C=IN"
          cp android/app/release-key.jks ../release-key.jks
          cp android/app/release-key.jks ./release-key.jks
          echo "storePassword=123456
          keyPassword=123456
          keyAlias=arrowpuzzle
          storeFile=release-key.jks" > android/key.properties
          cat android/key.properties
          ls -lh android/app/release-key.jks
          sed -i 's/applicationId "com.arrowpuzzle.arrowpuzzle"/applicationId "com.arrowpuzzle.durgesh0410"/' android/app/build.gradle
          sed -i 's/namespace "com.arrowpuzzle.arrowpuzzle"/namespace "com.arrowpuzzle.durgesh0410"/' android/app/build.gradle
          python3 << 'PY'
          import pathlib
          p = pathlib.Path('android/app/build.gradle')
          t = p.read_text()
          print("BEFORE:", t[0:1500])
          if 'keystoreProperties' not in t:
              t = t.replace('def localProperties', '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }
          def localProperties''')
          if 'signingConfigs {' not in t:
              t = t.replace('buildTypes {', '''signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {''')
          t = t.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          p.write_text(t)
          print("AFTER:", p.read_text()[0:2500])
          PY
          flutter pub get
          flutter build appbundle --release --build-name=1.0.0 --build-number=11
          echo "CHECK SIGNING:"
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab | head -20
      - name: SAVE KEY
        uses: actions/upload-artifact@v4
        with:
          name: release-key-jks
          path: release-key.jks
      - name: Upload AAB to Play Internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_KEY_JSON }}
          packageName: com.arrowpuzzle.durgesh0410
          releaseFiles: arrowpuzzle/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
