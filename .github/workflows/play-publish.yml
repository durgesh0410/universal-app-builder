name: Publish Arrow Puzzle FULL AUTO
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build AAB
        run: |
          cd arrowpuzzle
          flutter create --org com.arrowpuzzle --project-name arrowpuzzle .
          sed -i 's/applicationId = "com.arrowpuzzle.arrowpuzzle"/applicationId = "com.arrowpuzzle.durgesh0410"/' android/app/build.gradle.kts
          sed -i 's/namespace = "com.arrowpuzzle.arrowpuzzle"/namespace = "com.arrowpuzzle.durgesh0410"/' android/app/build.gradle.kts
          flutter pub get
          flutter build appbundle --release --build-name=1.0.0 --build-number=2
          echo "${{ secrets.PLAY_KEY_JSON }}" > fastlane/play-key.json
          gem install fastlane
      - name: Upload FULL - AAB + Screenshots + Listing to Internal
        run: |
          cd arrowpuzzle
          fastlane android internal
