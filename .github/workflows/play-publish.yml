name: Publish Arrow Puzzle FINAL
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.24.5' }
      - name: Build
        run: |
          cd arrowpuzzle
          flutter create --org com.arrowpuzzle --project-name arrowpuzzle .
          # CHABI FIX - ho to use karo, nahi to banao
          if [ -f "../release-key.jks" ]; then
            echo "Purani chabi mil gayi, wahi use kar raha hu"
            cp ../release-key.jks android/app/release-key.jks
            cp ../release-key.jks ./release-key.jks
          else
            echo "Chabi nahi mili, nayi bana raha hu aur lock kar raha hu"
            keytool -genkey -v -keystore android/app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias arrowpuzzle -storepass 123456 -keypass 123456 -dname "CN=Durgesh, OU=ArrowPuzzle, O=Durgesh, L=Dindori, ST=MP, C=IN"
            cp android/app/release-key.jks ./release-key.jks
            cp android/app/release-key.jks ../release-key.jks
          fi
          printf "storePassword=123456\nkeyPassword=123456\nkeyAlias=arrowpuzzle\nstoreFile=release-key.jks\n" > android/key.properties
          python3 << 'PY'
          import pathlib
          fp = pathlib.Path('android/app/build.gradle')
          t = fp.read_text()
          t = t.replace('com.arrowpuzzle.arrowpuzzle', 'com.arrowpuzzle.durgesh0410')
          t = t.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          if 'keystoreProperties' not in t:
              t = t.replace('android {', "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('key.properties')\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\nandroid {", 1)
          if 'keyAlias' not in t:
              t = t.replace('buildTypes {', "signingConfigs {\n release {\n keyAlias keystoreProperties['keyAlias']\n keyPassword keystoreProperties['keyPassword']\n storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n storePassword keystoreProperties['storePassword']\n }\n}\nbuildTypes {", 1)
          t = t.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          fp.write_text(t)
          PY
          flutter pub get
          flutter build appbundle --release --build-name=1.0.0 --build-number=17
      - name: Save Key
        uses: actions/upload-artifact@v4
        with:
          name: release-key-jks
          path: arrowpuzzle/android/app/release-key.jks
      - name: Upload AAB to Play Internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_KEY_JSON }}
          packageName: com.arrowpuzzle.durgesh0410
          releaseFiles: arrowpuzzle/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
