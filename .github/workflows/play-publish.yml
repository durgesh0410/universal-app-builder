name: Publish Arrow Puzzle FINAL
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build + Sign + Upload
        run: |
          cd arrowpuzzle
          flutter create --org com.arrowpuzzle --project-name arrowpuzzle .
          keytool -genkey -v -keystore android/app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias arrowpuzzle -storepass 123456 -keypass 123456 -dname "CN=Durgesh, OU=ArrowPuzzle, O=Durgesh, L=Dindori, ST=MP, C=IN"
          cp android/app/release-key.jks ../release-key.jks
          cp android/app/release-key.jks ./release-key.jks
          printf "storePassword=123456\nkeyPassword=123456\nkeyAlias=arrowpuzzle\nstoreFile=release-key.jks\n" > android/key.properties
          python3 << 'PY'
          import pathlib
          fp = pathlib.Path('android/app/build.gradle')
          t = fp.read_text()
          print(t[:2000])
          # package name fix - both styles
          t = t.replace('com.arrowpuzzle.arrowpuzzle', 'com.arrowpuzzle.durgesh0410')
          # plugins ke BAAD keystore load karo - pehle nahi
          if 'keystoreProperties' not in t:
              # plugins block ke baad insert karo
              # plugins { ... } ke closing } ke baad
              # simple: android { se pehle daalo
              t = t.replace('android {', '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }
          android {''', 1)
          # signingConfigs - Groovy style jo is file me chalega
          if 'signingConfigs' not in t:
              t = t.replace('buildTypes {', '''signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {''', 1)
          # debug -> release - dono style handle
          t = t.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          t = t.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          fp.write_text(t)
          print("==== AFTER ====")
          print(fp.read_text()[:3000])
          PY
          flutter pub get
          flutter build appbundle --release --build-name=1.0.0 --build-number=13
          ls -lh build/app/outputs/bundle/release/
      - name: SAVE KEY
        uses: actions/upload-artifact@v4
        with:
          name: release-key-jks
          path: release-key.jks
      - name: Upload AAB to Play Internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_KEY_JSON }}
          packageName: com.arrowpuzzle.durgesh0410
          releaseFiles: arrowpuzzle/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
