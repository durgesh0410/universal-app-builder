name: Publish Arrow Puzzle ONE SHOT
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Build AAB
        run: |
          cd arrowpuzzle
          flutter create --org com.arrowpuzzle --project-name arrowpuzzle .
          # dono file ka naam handle karo - kts ho ya gradle
          ls android/app/
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.arrowpuzzle.arrowpuzzle"/applicationId = "com.arrowpuzzle.durgesh0410"/' android/app/build.gradle.kts
            sed -i 's/namespace = "com.arrowpuzzle.arrowpuzzle"/namespace = "com.arrowpuzzle.durgesh0410"/' android/app/build.gradle.kts
          else
            sed -i 's/applicationId "com.arrowpuzzle.arrowpuzzle"/applicationId "com.arrowpuzzle.durgesh0410"/' android/app/build.gradle
            sed -i 's/namespace "com.arrowpuzzle.arrowpuzzle"/namespace "com.arrowpuzzle.durgesh0410"/' android/app/build.gradle
          fi
          flutter pub get
          flutter build appbundle --release --build-name=1.0.0 --build-number=7
      - name: Upload AAB to Internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_KEY_JSON }}
          packageName: com.arrowpuzzle.durgesh0410
          releaseFiles: arrowpuzzle/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Upload Screenshots + Listing
        run: |
          cd arrowpuzzle
          echo "${{ secrets.PLAY_KEY_JSON }}" > play-key.json
          gem install fastlane -N
          fastlane supply --json_key play-key.json --package_name com.arrowpuzzle.durgesh0410 --track internal --skip_upload_aab --skip_upload_apk --skip_upload_metadata false --skip_upload_images false --skip_upload_screenshots false --metadata_path fastlane/metadata/android --aab build/app/outputs/bundle/release/app-release.aab || echo "listing done"
