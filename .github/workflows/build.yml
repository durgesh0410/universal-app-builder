name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - run: |
          cd arrowpuzzle
          cp ../release-key.jks android/app/release-key.jks
          echo "storePassword=123456
          keyPassword=123456
          keyAlias=upload
          storeFile=release-key.jks" > android/key.properties
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: arrowpuzzle/build/app/outputs/bundle/release/app-release.aab
