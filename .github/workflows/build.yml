name: Build and Release Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Generated Apps
      run: |
        unzip Generated_Apps.zip -d extracted_apps
        echo "=== Checking folder contents ==="
        find extracted_apps -maxdepth 4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Build APK
      run: |
        # यहाँ हम उस फोल्डर में जाएंगे जहाँ असल में pubspec.yaml मौजूद है
        APP_DIR=$(find extracted_apps -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
        echo "Found Flutter project at: $APP_DIR"
        cd "$APP_DIR"
        flutter pub get
        flutter build apk --release

    - name: Create Release and Upload APK
      uses: ncipollo/release-action@v1
      with:
        artifacts: "**/build/app/outputs/flutter-apk/app-release.apk"
        tag: v1.0.${{ github.run_number }}
        name: "Release APK v1.0.${{ github.run_number }}"
        body: "Automated Flutter APK build generated via GitHub Actions."
        token: ${{ secrets.GITHUB_TOKEN }}
