name: Build All Apps Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [Arrow Puzzle, Ludo Game]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Android & Build ${{ matrix.app }}
        run: |
          # Folder name me se space hata kar handle karenge
          APP_DIR="${{ matrix.app }}"
          cd "$APP_DIR"
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.durgesh.app
          fi
          flutter pub get
          flutter build apk --release

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

