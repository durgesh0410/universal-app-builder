name: Build Arrow Puzzle
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          cd arrowpuzzle
          rm -rf android
          flutter create -t app . --org com.arrowpuzzle.game --project-name arrowpuzzle
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.10'/" android/build.gradle
          cat android/build.gradle | grep kotlin_version
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: arrowpuzzle-apk
          path: arrowpuzzle/build/app/outputs/flutter-apk/app-release.apk
