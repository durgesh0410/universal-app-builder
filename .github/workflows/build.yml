name: Build Arrow Puzzle
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - run: |
          ls arrowpuzzle/android || echo "android missing"
          if [ ! -d "arrowpuzzle/android" ]; then
            cp arrowpuzzle/lib/main.dart /tmp/my_main.dart
            cp arrowpuzzle/pubspec.yaml /tmp/my_pubspec.yaml
            mkdir -p /tmp/bak_assets && cp -r arrowpuzzle/assets/* /tmp/bak_assets/ 2>/dev/null || true
            rm -rf /tmp/fresh_app
            flutter create -t app --org com.example --project-name arrowpuzzle /tmp/fresh_app
            cp -r /tmp/fresh_app/android arrowpuzzle/android
            cp /tmp/my_main.dart arrowpuzzle/lib/main.dart
            cp /tmp/my_pubspec.yaml arrowpuzzle/pubspec.yaml
            mkdir -p arrowpuzzle/assets && cp -r /tmp/bak_assets/* arrowpuzzle/assets/ 2>/dev/null || true
          fi
          # AdMob crash fix - test ID daalo
          MANIFEST=arrowpuzzle/android/app/src/main/AndroidManifest.xml
          cat $MANIFEST
          if ! grep -q "APPLICATION_ID" $MANIFEST; then
            echo "Adding AdMob Test ID"
            sed -i 's|<application.*|<application android:label="arrowpuzzle" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>|' $MANIFEST
          fi
          cat $MANIFEST
          # Icon patla wala
          pip install pillow -q
          python3 make_new_icon.py
          python3 make_icons.py
          cd arrowpuzzle
          flutter pub get
          flutter build apk --release
          cd ..
          mkdir -p output
          cp arrowpuzzle/build/app/outputs/flutter-apk/app-release.apk output/arrowpuzzle.apk
          ls -lh output/
      - uses: actions/upload-artifact@v4
        with:
          name: arrowpuzzle-apk-with-icon
          path: output/arrowpuzzle.apk
      - name: Release bahar with icon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Arrow Puzzle With Icon v1.${{ github.run_number }}
          files: output/arrowpuzzle.apk
