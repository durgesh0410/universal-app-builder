name: Build 6 Separate Apps Correctly

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Apps
      run: |
        unzip -q Generated_Apps.zip -d extracted_apps
        echo "=== Checking folder structure ==="
        find extracted_apps -type d

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Build All 6 Apps Separately
      run: |
        ROOT=$PWD
        mkdir -p "$ROOT/final_apks"
        
        # Zip ke andar jahan bhi main folders hain unhe dhoondhenge
        TARGET_DIR=$(find extracted_apps -type d -name "Generated_Apps" | head -n 1)
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR="extracted_apps"
        fi
        
        echo "Target scanning directory: $TARGET_DIR"
        
        # 1 se lekar 6 tak saare apps ke liye alag loop chalayenge
        i=1
        for dir in "$TARGET_DIR"/*/; do
          if [ -d "$dir" ] && [ $i -le 6 ]; then
            RAW_NAME=$(basename "$dir")
            APP_NAME="App_$i"
            
            echo "=============================================="
            echo "Building App $i: $APP_NAME (Source: $RAW_NAME)"
            echo "=============================================="
            
            # Har app ke liye bilkul naya project banayenge jiska package ID alag hoga
            flutter create --org com.durgesh.app$i --project-name="app_$i" "$ROOT/workspace_$i"
            
            cd "$ROOT/workspace_$i"
            
            # Agar zip folder mein data hai toh use assets mein copy karenge
            if [ -d "$dir" ]; then
              cp -r "$dir"* "assets/" 2>/dev/null || true
            fi
            
            flutter pub get
            flutter build apk --release --split-per-abi
            
            # Chote size ka release APK uthakar final folder mein save karenge
            if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
              cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$ROOT/final_apks/${APP_NAME}.apk"
              echo "SUCCESS: ${APP_NAME}.apk created!"
            elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
              cp build/app/outputs/flutter-apk/app-release.apk "$ROOT/final_apks/${APP_NAME}.apk"
              echo "SUCCESS: ${APP_NAME}.apk created!"
            fi
            
            cd "$ROOT"
            i=$((i + 1))
          fi
        done
        
        echo "=== All Generated APKs ==="
        ls -la "$ROOT/final_apks"

    - name: Upload All 6 APKs to Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "final_apks/*.apk"
        tag: v1.0.${{ github.run_number }}
        name: "6 Separate Apps v1.0.${{ github.run_number }}"
        body: "All 6 individual apps built successfully with unique package IDs, low size, and ready to install and open properly."
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
