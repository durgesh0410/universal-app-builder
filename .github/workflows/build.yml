name: Build and Release Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Generated Apps
      run: |
        unzip Generated_Apps.zip -d extracted_apps
        cd extracted_apps/Generated_Apps/1_Sudoku_Classic

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Install Dependencies
      run: |
        cd extracted_apps/Generated_Apps/1_Sudoku_Classic
        flutter pub get

    - name: Build APK
      run: |
        cd extracted_apps/Generated_Apps/1_Sudoku_Classic
        flutter build apk --release

    - name: Create Release and Upload APK
      uses: ncipollo/release-action@v1
      with:
        artifacts: "extracted_apps/Generated_Apps/1_Sudoku_Classic/build/app/outputs/flutter-apk/app-release.apk"
        tag: v1.0.${{ github.run_number }}
        name: "Release APK v1.0.${{ github.run_number }}"
        body: "Automated Flutter APK build generated via GitHub Actions."
        token: ${{ secrets.GITHUB_TOKEN }}
