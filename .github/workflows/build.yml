name: Build Arrow Puzzle
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - run: |
          echo "=== MainActivity fix V1 -> V2, android folder delete nahi ==="
          find arrowpuzzle/android -name "MainActivity*"
          cat arrowpuzzle/android/app/src/main/java/com/example/arrowpuzzle/MainActivity.kt 2>/dev/null || cat arrowpuzzle/android/app/src/main/java/com/example/arrowpuzzle/MainActivity.java 2>/dev/null || echo "not found kt/java"
          # Kotlin wali file ko V2 me badlo
          MAIN_KT=$(find arrowpuzzle/android -name "MainActivity.kt" | head -1)
          MAIN_JAVA=$(find arrowpuzzle/android -name "MainActivity.java" | head -1)
          if [ -n "$MAIN_KT" ]; then
            echo "Fixing $MAIN_KT"
            cat > "$MAIN_KT" << 'KT'
          package com.example.arrowpuzzle
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          KT
          fi
          if [ -n "$MAIN_JAVA" ]; then
            echo "Fixing $MAIN_JAVA"
            cat > "$MAIN_JAVA" << 'JAVA'
          package com.example.arrowpuzzle;
          import io.flutter.embedding.android.FlutterActivity;
          public class MainActivity extends FlutterActivity {}
          JAVA
          fi
          # Manifest me embedding 2 set karo
          sed -i 's/flutterEmbedding.*/flutterEmbedding" android:value="2" \/>/g' arrowpuzzle/android/app/src/main/AndroidManifest.xml || true
          grep -n "flutterEmbedding" arrowpuzzle/android/app/src/main/AndroidManifest.xml || true
          # Icon wahi patla wala
          pip install pillow -q
          python3 make_new_icon.py
          python3 make_icons.py
          ls -lh arrowpuzzle/assets/icon.png
          cd arrowpuzzle
          flutter pub get
          flutter build apk --release
          cd ..
          mkdir -p output
          cp arrowpuzzle/build/app/outputs/flutter-apk/app-release.apk output/arrowpuzzle.apk
          ls -lh output/
      - uses: actions/upload-artifact@v4
        with:
          name: arrowpuzzle-apk-with-icon
          path: output/arrowpuzzle.apk
      - name: Release bahar with icon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Arrow Puzzle With Icon v1.${{ github.run_number }}
          files: output/arrowpuzzle.apk
