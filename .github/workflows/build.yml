name: Build and Release Flutter Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK for ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [arrow_puzzle, ludogame]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Get Dependencies & Build
        run: |
          cd ${{ matrix.app }}
          flutter pub get
          flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v1
        with:
          files: |
            arrow_puzzle-apk/*.apk
            ludogame-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
