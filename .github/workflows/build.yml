name: Build and Release Flutter APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Generated Apps
      run: |
        echo "Unzipping Generated_Apps.zip..."
        unzip -q Generated_Apps.zip -d extracted_apps

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Build All Flutter Apps Found
      run: |
        # वर्कस्पेस रूट का एब्सोल्यूट पाथ सेव कर रहे हैं
        ROOT_DIR=$PWD
        mkdir -p "$ROOT_DIR/collected_apks"
        
        find extracted_apps -name "pubspec.yaml" | while read pubspec; do
          APP_DIR=$(dirname "$pubspec")
          echo "=============================================="
          echo "Building Flutter app in directory: $APP_DIR"
          echo "=============================================="
          cd "$APP_DIR"
          flutter pub get
          flutter build apk --release
          
          # सीधे एब्सोल्यूट पाथ का इस्तेमाल करके APK कॉपी करेंगे
          if ls build/app/outputs/flutter-apk/*.apk 1> /dev/null 2>&1; then
            cp build/app/outputs/flutter-apk/*.apk "$ROOT_DIR/collected_apks/"
            echo "APK successfully copied!"
          else
            echo "Warning: APK not found for this app."
          fi
          
          cd "$ROOT_DIR"
        done
        
        echo "Final check of collected APKs:"
        ls -la "$ROOT_DIR/collected_apks"

    - name: Create Release and Upload APKs
      uses: ncipollo/release-action@v1
      with:
        artifacts: "collected_apks/*.apk"
        tag: v1.0.${{ github.run_number }}
        name: "Release APKs v1.0.${{ github.run_number }}"
        body: "Automated multi-app Flutter APK build generated successfully via GitHub Actions."
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
