name: Build and Release Flutter APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Configs
      run: |
        echo "Unzipping Generated_Apps.zip..."
        unzip -q Generated_Apps.zip -d extracted_apps
        ls -la extracted_apps

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Generate Flutter Projects and Build APKs
      run: |
        ROOT_DIR=$PWD
        mkdir -p "$ROOT_DIR/collected_apks"

        # अगर ज़िप में सिर्फ फोल्डर हैं, तो उनके लिए बेसिक फ्लटर प्रोजेक्ट खुद बनाएंगे
        for dir in extracted_apps/*/ ; do
          if [ -d "$dir" ]; then
            APP_NAME=$(basename "$dir")
            echo "Processing $APP_NAME..."
            
            # एक नया फ्लटर प्रोजेक्ट बनाएंगे
            flutter create --org com.durgesh --project-name="$APP_NAME" temp_project_$APP_NAME
            
            # उसे सही जगह मूव करेंगे
            rm -rf "$dir/*"
            cp -r temp_project_$APP_NAME/* "$dir/"
            rm -rf temp_project_$APP_NAME
            
            # अब इस ऐप को बिल्ड करेंगे
            cd "$dir"
            flutter pub get
            flutter build apk --release
            
            # APK को कलेक्टेड फोल्डर में भेजेंगे
            if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
              cp build/app/outputs/flutter-apk/app-release.apk "$ROOT_DIR/collected_apks/${APP_NAME}.apk"
              echo "SUCCESS: APK created for $APP_NAME"
            fi
            
            cd "$ROOT_DIR"
          fi
        done

        echo "Final collected APKs:"
        ls -la "$ROOT_DIR/collected_apks"

    - name: Create Release and Upload APKs
      uses: ncipollo/release-action@v1
      with:
        artifacts: "collected_apks/*.apk"
        tag: v1.0.${{ github.run_number }}
        name: "Release APKs v1.0.${{ github.run_number }}"
        body: "Automated Flutter apps generated and built successfully via GitHub Actions."
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
