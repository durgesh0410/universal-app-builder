name: Build and Release All Installable Apps

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Generated Apps
      run: |
        echo "Unzipping Generated_Apps.zip..."
        unzip -q Generated_Apps.zip -d extracted_apps

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Build Installable APKs for All Apps
      run: |
        ROOT_DIR=$PWD
        mkdir -p "$ROOT_DIR/collected_apks"
        
        # Zip ke andar exact root path dhoondhenge
        TARGET_PATH=$(find extracted_apps -type d -name "Generated_Apps" | head -n 1)
        if [ -z "$TARGET_PATH" ]; then
          TARGET_PATH="extracted_apps"
        fi

        counter=1
        for dir in "$TARGET_PATH"/*/; do
          if [ -d "$dir" ]; then
            RAW_NAME=$(basename "$dir")
            APP_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9_]/_/g')
            
            echo "=============================================="
            echo "Creating & Building App $counter: $APP_NAME"
            echo "=============================================="
            
            # Pure project structure generate karenge
            flutter create --org "com.durgesh.app$counter" --project-name "app_$counter" "$ROOT_DIR/temp_app_$counter"
            
            # Agar folder ke andar JSON config hai toh use assets mein incorporate kar sakte hain
            if [ -d "$dir" ]; then
              cp -r "$dir"* "$ROOT_DIR/temp_app_$counter/assets/" 2>/dev/null || true
            fi
            
            cd "$ROOT_DIR/temp_app_$counter"
            flutter pub get
            
            # APK build without restriction
            flutter build apk --debug
            
            if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
              cp build/app/outputs/flutter-apk/app-debug.apk "$ROOT_DIR/collected_apks/${APP_NAME}.apk"
              echo "SUCCESS: $APP_NAME.apk generated and signed successfully!"
            fi
            
            cd "$ROOT_DIR"
            rm -rf "$ROOT_DIR/temp_app_$counter"
            counter=$((counter + 1))
          fi
        done
        
        echo "Checking installable APKs:"
        ls -la "$ROOT_DIR/collected_apks"

    - name: Create Release and Upload APKs
      uses: ncipollo/release-action@v1
      with:
        artifacts: "collected_apks/*.apk"
        tag: v1.0.${{ github.run_number }}
        name: "Installable APKs v1.0.${{ github.run_number }}"
        body: "All apps compiled with standard installable keys. Download and tap to install directly on Android."
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
