name: Build Arrow Puzzle
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - run: |
          cp arrowpuzzle/lib/main.dart /tmp/my_main.dart
          cp arrowpuzzle/pubspec.yaml /tmp/my_pubspec.yaml
          rm -rf /tmp/fresh_app
          flutter create --org com.arrowpuzzle.game --project-name arrowpuzzle /tmp/fresh_app
          rm -rf arrowpuzzle/android
          cp -r /tmp/fresh_app/android arrowpuzzle/android
          cp /tmp/my_main.dart arrowpuzzle/lib/main.dart
          cp /tmp/my_pubspec.yaml arrowpuzzle/pubspec.yaml
          mkdir -p arrowpuzzle/assets/sounds
          touch arrowpuzzle/assets/sounds/tap.mp3 arrowpuzzle/assets/sounds/exit.mp3 arrowpuzzle/assets/sounds/win.mp3
          ls -R arrowpuzzle/android
          # MANIFEST FIX - dono gradle type handle
          python3 << 'PY'
          import pathlib, os
          path="arrowpuzzle/android/app/src/main/AndroidManifest.xml"
          txt=open(path).read()
          print(txt[:600])
          if "APPLICATION_ID" not in txt:
              idx = txt.find("<application")
              end = txt.find(">", idx)
              txt = txt[:end+1] + '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' + txt[end+1:]
              open(path,'w').write(txt)
              print("manifest fixed")
          # settings file jo bhi ho print karo, error mat do
          for f in ["arrowpuzzle/android/settings.gradle", "arrowpuzzle/android/settings.gradle.kts"]:
              if os.path.exists(f):
                  print("FOUND:", f)
                  print(open(f).read()[:800])
          PY
          cd arrowpuzzle
          flutter pub get
          flutter build apk --release
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Arrow Puzzle v1.0.${{ github.run_number }}
          files: arrowpuzzle/build/app/outputs/flutter-apk/app-release.apk
          body: "Built with Flutter 3.32"
