name: Build 6 Distinct Apps

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Apps
      run: |
        unzip -q Generated_Apps.zip -d extracted_apps
        echo "=== Listing extracted folders ==="
        find extracted_apps -maxdepth 3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Build All 6 Individual Apps
      run: |
        ROOT=$PWD
        mkdir -p "$ROOT/final_apks"
        
        # Zip ke andar ke saare 6 folder ko ek-ek karke pakdenge
        i=1
        for dir in extracted_apps/*/ ; do
          if [ -d "$dir" ] && [ $i -le 6 ]; then
            RAW_NAME=$(basename "$dir")
            # Agar folder ka naam lamba ya ajeeb hai toh saaf naam denge
            APP_NAME="App_$i"
            
            echo "=============================================="
            echo "Building App $i: $APP_NAME (from $RAW_NAME)"
            echo "=============================================="
            
            # Har app ke liye bilkul naya aur alag package ID ke sath project banayenge
            flutter create --org com.durgesh.app$i --project-name="app_$i" "$ROOT/workspace_$i"
            
            cd "$ROOT/workspace_$i"
            
            # Agar zip ke andar koi config ya assets hain toh unhe copy kar sakte hain
            if [ -d "$dir" ]; then
              cp -r "$dir"* "assets/" 2>/dev/null || true
            fi
            
            flutter pub get
            flutter build apk --release --split-per-abi
            
            # Sabse halka aur sahi release APK utha kar final folder mein alag naam se rakhenge
            if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
              cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$ROOT/final_apks/${APP_NAME}.apk"
              echo "SUCCESS: ${APP_NAME}.apk created!"
            elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
              cp build/app/outputs/flutter-apk/app-release.apk "$ROOT/final_apks/${APP_NAME}.apk"
              echo "SUCCESS: ${APP_NAME}.apk created!"
            fi
            
            cd "$ROOT"
            i=$((i + 1))
          fi
        done
        
        echo "=== Final APKs Generated ==="
        ls -la "$ROOT/final_apks"

    - name: Upload 6 APKs to Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "final_apks/*.apk"
        tag: v1.0.${{ github.run_number }}
        name: "6 Separate Apps v1.0.${{ github.run_number }}"
        body: "Here are all 6 individual apps built separately with unique package IDs, low size, and ready to install and open properly."
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
