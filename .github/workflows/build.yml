name: Build and Release All 6 Flutter Apps

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Generated Apps
      run: |
        echo "Unzipping Generated_Apps.zip..."
        unzip -q Generated_Apps.zip -d extracted_apps
        ls -R extracted_apps

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Build All 6 Apps Separately
      run: |
        ROOT_DIR=$PWD
        mkdir -p "$ROOT_DIR/collected_apks"
        
        # Har ek alag app ke folder par loop chalayenge
        counter=1
        for dir in extracted_apps/sdcard/Download/Generated_Apps/*/; do
          if [ -d "$dir" ]; then
            RAW_NAME=$(basename "$dir")
            APP_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-Z0-9_]/_/g')
            echo "=============================================="
            echo "Building App $counter: $APP_NAME"
            echo "=============================================="
            
            # Har app ke liye ek naya aur saaf flutter project banayenge
            flutter create --org com.durgesh.app$counter --project-name="app_$counter" "$ROOT_DIR/temp_app_$counter"
            
            cd "$ROOT_DIR/temp_app_$counter"
            
            # Dependencies get karke release APK banayenge
            flutter pub get
            flutter build apk --release
            
            # APK ko uske asli naam se collected_apks folder mein copy karenge
            if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
              cp build/app/outputs/flutter-apk/app-release.apk "$ROOT_DIR/collected_apks/${APP_NAME}.apk"
              echo "SUCCESS: $APP_NAME.apk created successfully!"
            else
              echo "ERROR: Failed to build $APP_NAME"
            fi
            
            cd "$ROOT_DIR"
            rm -rf "$ROOT_DIR/temp_app_$counter"
            counter=$((counter + 1))
          fi
        done
        
        echo "Checking all generated APKs:"
        ls -la "$ROOT_DIR/collected_apks"

    - name: Create Release and Upload All APKs
      uses: ncipollo/release-action@v1
      with:
        artifacts: "collected_apks/*.apk"
        tag: v1.0.${{ github.run_number }}
        name: "Release All 6 Apps v1.0.${{ github.run_number }}"
        body: "All 6 individual Flutter apps built separately with unique package names, ready to install and open properly."
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
