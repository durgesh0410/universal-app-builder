name: Build and Release Flutter Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK for ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ArrowPuzzle, LudoGame]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Clean and Get Dependencies
        run: |
          cd ${{ matrix.app }}
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ matrix.app }}
          flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p build/apk_outputs
          if [ "${{ matrix.app }}" = "ArrowPuzzle" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/apk_outputs/ArrowPuzzle-release.apk
          elif [ "${{ matrix.app }}" = "LudoGame" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/apk_outputs/LudoGame-release.apk
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: build/apk_outputs/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ArrowPuzzle-apk/*.apk
            LudoGame-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

