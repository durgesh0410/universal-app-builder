name: Build and Release Flutter APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Generated Apps
      run: |
        echo "Unzipping Generated_Apps.zip..."
        unzip -q Generated_Apps.zip -d extracted_apps
        echo "Listing all pubspec.yaml found:"
        find extracted_apps -name "pubspec.yaml"

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Build All Flutter Apps Found
      run: |
        find extracted_apps -name "pubspec.yaml" | while read pubspec; do
          APP_DIR=$(dirname "$pubspec")
          echo "=============================================="
          echo "Building Flutter app in directory: $APP_DIR"
          echo "=============================================="
          cd "$APP_DIR"
          flutter pub get
          flutter build apk --release
          cd - > /dev/null
        done

    - name: List built APKs for verification
      run: |
        echo "Searching for built APKs..."
        find extracted_apps -name "*.apk"

    - name: Create Release and Upload APKs
      uses: ncipollo/release-action@v1
      with:
        artifacts: "extracted_apps/**/build/app/outputs/flutter-apk/*.apk"
        tag: v1.0.${{ github.run_number }}
        name: "Release APKs v1.0.${{ github.run_number }}"
        body: "Automated multi-app Flutter APK build generated via GitHub Actions."
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
