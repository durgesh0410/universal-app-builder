name: Build Release APK on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Android Files for Arrow Puzzle
        run: |
          cd 1_Arrow_Puzzle
          flutter create . --platforms=android --org com.durgesh.arrow

      - name: Generate Android Files for Ludo Game
        run: |
          cd 2_Ludo_Game
          flutter create . --platforms=android --org com.durgesh.ludo

      - name: Build Arrow Puzzle APK
        run: |
          cd 1_Arrow_Puzzle
          flutter pub get
          flutter build apk --release

      - name: Build Ludo Game APK
        run: |
          cd 2_Ludo_Game
          flutter pub get
          flutter build apk --release

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v1
        with:
          files: |
            1_Arrow_Puzzle/build/app/outputs/flutter-apk/app-release.apk
            2_Ludo_Game/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

