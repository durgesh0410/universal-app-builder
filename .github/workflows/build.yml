name: Build Arrow Puzzle
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - run: |
          ls -R arrowpuzzle | head -n 100
          echo "--- android check ---"
          ls arrowpuzzle/android || echo "android MISSING"
          # Agar android folder nahi hai to fresh banao
          if [ ! -d "arrowpuzzle/android" ]; then
            echo "android folder missing - recreating"
            cp arrowpuzzle/lib/main.dart /tmp/my_main.dart
            cp arrowpuzzle/pubspec.yaml /tmp/my_pubspec.yaml
            mkdir -p /tmp/bak_assets
            cp -r arrowpuzzle/assets/* /tmp/bak_assets/ 2>/dev/null || true
            rm -rf /tmp/fresh_app
            flutter create -t app --org com.example --project-name arrowpuzzle /tmp/fresh_app
            cp -r /tmp/fresh_app/android arrowpuzzle/android
            cp /tmp/my_main.dart arrowpuzzle/lib/main.dart
            cp /tmp/my_pubspec.yaml arrowpuzzle/pubspec.yaml
            mkdir -p arrowpuzzle/assets
            cp -r /tmp/bak_assets/* arrowpuzzle/assets/ 2>/dev/null || true
            ls arrowpuzzle/android/app/src/main/
          fi
          echo "--- MainActivity fix V2 ---"
          find arrowpuzzle/android -name "MainActivity*"
          MAIN_KT=$(find arrowpuzzle/android -name "MainActivity.kt" | head -1)
          if [ -n "$MAIN_KT" ]; then
            echo "Fixing $MAIN_KT"
            PKG=$(grep -r "package " "$MAIN_KT" | head -1 | awk '{print $2}')
            echo "package is $PKG"
            cat > "$MAIN_KT" << KT
          package com.example.arrowpuzzle
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          KT
          fi
          grep -n "flutterEmbedding" arrowpuzzle/android/app/src/main/AndroidManifest.xml || echo "no embedding tag - ok V2 default"
          pip install pillow -q
          python3 make_new_icon.py
          python3 make_icons.py
          ls -lh arrowpuzzle/assets/icon.png
          cd arrowpuzzle
          flutter pub get
          flutter build apk --release
          cd ..
          mkdir -p output
          cp arrowpuzzle/build/app/outputs/flutter-apk/app-release.apk output/arrowpuzzle.apk
          ls -lh output/
      - uses: actions/upload-artifact@v4
        with:
          name: arrowpuzzle-apk-with-icon
          path: output/arrowpuzzle.apk
      - name: Release bahar with icon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Arrow Puzzle With Icon v1.${{ github.run_number }}
          files: output/arrowpuzzle.apk
