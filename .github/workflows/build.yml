name: Build Arrow Puzzle
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - run: |
          pip install pillow -q
          python3 make_new_icon.py
          python3 make_icons.py
          ls -lh arrowpuzzle/assets/icon.png
          ls arrowpuzzle/android/app/src/main/res/mipmap-xxxhdpi/
          cd arrowpuzzle
          flutter pub get
          flutter build apk --release
          cd ..
          mkdir -p output
          cp arrowpuzzle/build/app/outputs/flutter-apk/app-release.apk output/arrowpuzzle.apk
          ls -lh output/
      - uses: actions/upload-artifact@v4
        with:
          name: arrowpuzzle-apk-with-icon
          path: output/arrowpuzzle.apk
      - name: Release bahar with icon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Arrow Puzzle With Icon v1.${{ github.run_number }}
          files: output/arrowpuzzle.apk
