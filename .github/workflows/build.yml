name: Build Light APKs

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Unzip Apps
      run: |
        unzip -q Generated_Apps.zip -d extracted_apps

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'

    - name: Build Light Release APKs
      run: |
        ROOT=$PWD
        mkdir -p "$ROOT/my_apks"
        
        find extracted_apps -name "pubspec.yaml" | while read file; do
          DIR=$(dirname "$file")
          NAME=$(basename "$DIR")
          
          echo "Building light release for: $NAME"
          cd "$DIR"
          flutter pub get
          
          # split-per-abi से APK का साइज़ बहुत छोटा (कम MB का) बनता है
          flutter build apk --release --split-per-abi
          
          # सबसे हल्की और सही release APK को कलेक्ट करेंगे
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$ROOT/my_apks/${NAME}.apk"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "$ROOT/my_apks/${NAME}.apk"
          fi
          
          cd "$ROOT"
        done

    - name: Upload to Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "my_apks/*.apk"
        tag: v1.0.${{ github.run_number }}
        name: "Light Apps v1.0.${{ github.run_number }}"
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
